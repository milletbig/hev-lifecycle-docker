name: hev-lifecycle

services:
  hev-lifecycle:
    image: ghcr.io/milletbig/hev-lifecycle-docker:1.0.2
    container_name: hev-lifecycle
    restart: unless-stopped
    init: true

    env_file:
      - .env

    ports:
      - "${HEV_BIND_ADDR:-0.0.0.0}:${HEV_PORT:-18480}:8080"

    volumes:
      # 业务数据、自动备份、会话密钥默认落在宿主机 /opt/hev-lifecycle/data
      - "${HEV_DATA_DIR:-/opt/hev-lifecycle/data}:/data"

    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777

    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

    # 资源配额：单核 256MB 已可稳定承载本工具，为宿主机留出余量
    mem_limit: 256m
    memswap_limit: 256m
    cpus: 1.0
    pids_limit: 128

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
